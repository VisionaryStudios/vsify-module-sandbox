[project]
name = "vsify-module-sandbox"
version = "0.1.0"
description = "Sandbox execution image for vsify-enterprise-mcp signed-quarantined capability modules (ADR-P041)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# `tests` so a test can `from conftest import load_script_module` under any import mode, not
# only as a side effect of the default prepend mode (same reason as the framework's pyproject).
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
