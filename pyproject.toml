[project]
name = "vsify-module-sandbox"
version = "0.1.0"
description = "Sandbox execution image for vsify-enterprise-mcp signed-quarantined capability modules (ADR-P041)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
