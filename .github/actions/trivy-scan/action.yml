name: trivy-scan
description: >
  Shared Trivy vulnerability scan against a pinned image digest -- the pinned trivy-action SHA,
  the trivy-db mirror list, and the timeout previously lived as 4 separately hand-copied blocks
  across build-verify-promote.yml and base-image-watch.yml (plus a 5th added for
  rollback-latest.yml's rollback-target gate). One definition means a future SHA bump, mirror-URL
  change, or timeout tweak can no longer be applied to one copy and missed in another.

inputs:
  image-ref:
    description: "<registry>/<repo>@sha256:<digest> -- always a digest, never a tag"
    required: true
  format:
    description: "sarif (non-gating, includes unfixed) or table (the gate)"
    required: true
  output:
    description: "Output file path. Leave empty for a table pass (prints to the job log)."
    required: false
    default: ""
  severity:
    required: false
    default: "CRITICAL,HIGH"
  ignore-unfixed:
    description: "true for the GATE pass (fixable-only); false for the full-picture SARIF pass"
    required: false
    default: "false"
  exit-code:
    description: "1 to gate the job on findings; 0 to record without gating"
    required: false
    default: "0"
  skip-db-update:
    description: >
      true to scan with the DB already in the cache dir (fetched by an earlier pass, or handed over as
      an artifact) and never download one. Reaches Trivy as TRIVY_SKIP_DB_UPDATE: the pinned
      trivy-action declares no such input, so passing it through `with:` was silently ignored.
    required: false
    default: "false"
  cache:
    description: >
      false to skip trivy-action's own actions/cache restore and save of the DB. A caller scanning
      with a DB it was handed must set this: the restore runs inside the scan step, after any
      download, and its prefix restore-key can put back a DB of any age over the one handed over.
    required: false
    default: "true"
  limit-severities-for-sarif:
    required: false
    default: "false"
  trivyignores:
    required: false
    default: ".trivyignore"
  platform:
    description: >
      os/arch of the index member to scan (issue #672). Empty keeps Trivy's own choice -- right for
      a single-platform image such as the framework CI's local build, WRONG for a multi-platform
      index, where it scans one member and says nothing about the rest. Every mirror caller that
      scans a published digest passes it.
    required: false
    default: ""
  registry-username:
    description: "Passed through explicitly -- a composite action does not inherit the caller's secrets context"
    required: true
  registry-password:
    required: true

runs:
  using: composite
  steps:
    # Fail closed on anything but an empty value or an os/arch(/variant) shape, before it reaches
    # Trivy. Read through `env:`, never spliced into the script -- an input interpolated into a run
    # body is a script-injection sink.
    - name: Refuse a malformed platform
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      # `[[ =~ ]]` anchors on the WHOLE value; `grep` matches line by line, so a multi-line value
      # whose every line is well-formed would have passed.
      run: |
        shape='^[a-z0-9]+/[a-z0-9_]+(/[a-z0-9]+)?$'
        if [ -n "$PLATFORM" ] && ! [[ "$PLATFORM" =~ $shape ]]; then
          echo "::error title=trivy-scan::platform must be empty or os/arch[/variant]; got an unexpected value"
          exit 1
        fi
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        scanners: vuln
        format: ${{ inputs.format }}
        output: ${{ inputs.output }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        exit-code: ${{ inputs.exit-code }}
        cache: ${{ inputs.cache }}
        limit-severities-for-sarif: ${{ inputs.limit-severities-for-sarif }}
        trivyignores: ${{ inputs.trivyignores }}
      env:
        # trivy-db is hosted on GHCR and ANONYMOUS pulls are rate-limited -- the known real
        # failure mode. Authenticating moves the pull off the shared anonymous bucket; the second
        # entry is a fallback mirror, tried in order.
        TRIVY_USERNAME: ${{ inputs.registry-username }}
        TRIVY_PASSWORD: ${{ inputs.registry-password }}
        TRIVY_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2"
        TRIVY_TIMEOUT: "10m"
        # Trivy's --platform, by env: empty is the same as the flag being absent.
        TRIVY_PLATFORM: ${{ inputs.platform }}
        # Trivy's --skip-db-update, by env (see the input). With no DB in the cache dir Trivy refuses
        # to scan, so a caller that skips the update fails closed when nothing was handed over.
        TRIVY_SKIP_DB_UPDATE: ${{ inputs.skip-db-update }}
