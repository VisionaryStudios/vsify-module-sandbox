name: base-image-watch

# Two failure modes the build pipeline structurally CANNOT see, closed by one file.
#
#   1. THE PIN GOES STALE AND NOBODY NOTICES. A repo with no commits has a permanently green CI
#      and an arbitrarily old base image. Worse, a misconfigured docker ecosystem looks exactly
#      like a healthy one from inside the repo -- which is not hypothetical here: the previous
#      `ARG BASE_IMAGE` indirection made Dependabot a silent no-op, and nothing surfaced it.
#      So this job MEASURES the pin against the live upstream index digest and then asks whether
#      Dependabot actually opened a PR. Its health is judged by OUTCOME, never assumed from the
#      presence of a config file.
#
#   2. THE PROMOTED IMAGE ROTS AFTER PROMOTION. `verify` scans at build time, but `:latest` serves
#      production until the next promote -- which, on a 15-file repo, may be months. A CVE
#      disclosed the day after promotion is otherwise invisible. This re-scans what `:latest`
#      ACTUALLY points at, fixed-only, so it reddens exactly when a remedy exists. Measured
#      precedent: a python:3.12-slim only nine days stale already carried 3 fixable HIGH
#      (openssl CVE-2026-14456).
#
# KNOWN LIMIT, stated rather than papered over: GitHub disables scheduled workflows after 60 days
# of repository inactivity -- which this repo can plausibly reach, and which is exactly the quiet
# period this job exists to cover. Dependabot's own branch pushes count as activity, so in practice
# the two mechanisms keep each other alive; but if BOTH stop, the silence is indistinguishable from
# health. Closing that needs an out-of-repo monitor, which is disproportionate here and is accepted
# as a residual.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC, just after Dependabot's own 06:00 window
  workflow_dispatch:

permissions:
  contents: read

env:
  # Sourced from the repo variable `vars.IMAGE` -- see build-verify-promote.yml's env block for why.
  IMAGE: ${{ vars.IMAGE }}
  BASE_TAG: python:3.12-slim

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # NOTE: this step reports its verdict via `pin.outputs.status` instead of `exit 1` on a
      # drifted/no-PR/stale-PR finding. Exiting here used to skip every later step -- including
      # the promoted-image CVE re-scan below, which is this job's OTHER, independent purpose --
      # exactly when the docker ecosystem is broken (the scenario this step itself detects). The
      # final "Watch verdict" step aggregates this output with the CVE gate's outcome and is what
      # actually fails the job, so a stale pin no longer silently suppresses the CVE re-scan.
      - name: Is the pin stale -- and did Dependabot notice?
        id: pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pinned="$(grep -m1 -oE 'sha256:[0-9a-f]{64}' Dockerfile)"
          live="$(docker buildx imagetools inspect "${BASE_TAG}" --format '{{ .Manifest.Digest }}')"
          {
            echo "### base-image pin"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| pinned | \`${pinned}\` |"
            echo "| upstream \`${BASE_TAG}\` | \`${live}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${pinned}" = "${live}" ]; then
            echo "| verdict | current |" >> "$GITHUB_STEP_SUMMARY"
            echo "status=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prs="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open \
                   --search 'author:app/dependabot' --json number,title,createdAt)"

          if [ "$(jq 'length' <<<"${prs}")" -eq 0 ]; then
            echo "| verdict | **DRIFTED, and Dependabot opened NO PR** |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Base pin is stale and no Dependabot PR exists. The docker ecosystem is not producing updates. Check Insights > Dependency graph > Dependabot for the last run and its error, and confirm the FROM line still carries BOTH a tag and a digest."
            echo "status=drifted_no_pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -r '.[] | "| open Dependabot PR | #\(.number) \(.title) — \(.createdAt) |"' \
            <<<"${prs}" >> "$GITHUB_STEP_SUMMARY"

          oldest="$(jq -r 'min_by(.createdAt).createdAt' <<<"${prs}")"
          age=$(( ( $(date -u +%s) - $(date -u -d "${oldest}" +%s) ) / 86400 ))
          echo "| oldest PR age | ${age}d |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${age}" -gt 14 ]; then
            echo "::error::Base pin is stale and the oldest Dependabot PR has been unreviewed for ${age} days. Review debt on the base image is the same exposure as having no Dependabot at all."
            echo "status=drifted_stale_pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::Base pin is stale; a Dependabot PR is open (${age}d) and unmerged."
          echo "status=drifted_fresh_pr" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve what :latest actually points at right now
        id: promoted
        run: |
          set -euo pipefail
          d="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{ .Manifest.Digest }}')"
          echo "digest=${d}" >> "$GITHUB_OUTPUT"
          echo "| promoted \`:latest\` | \`${d}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Re-scan the PROMOTED image (SARIF, non-gating -- includes unfixed)
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.promoted.outputs.digest }}
          format: sarif
          output: trivy-promoted.sarif
          limit-severities-for-sarif: "true"
          exit-code: "0"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      # A DISTINCT category from `verify`'s. "As running" and "as built" must not overwrite each
      # other -- the difference between them is the entire post-promotion signal.
      - name: Publish as-running results (distinct category from as-built)
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-promoted.sarif
          category: trivy-image-promoted

      # `continue-on-error: true` -- a CVE-gate failure here must not skip the final "Watch
      # verdict" step below, which is what actually fails the job. This mirrors the pin-status
      # output above: report, don't short-circuit, so both independent checks always run and are
      # combined into one verdict.
      - name: GATE -- fixable findings in the image production is running right now
        id: gate
        continue-on-error: true
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.promoted.outputs.digest }}
          format: table
          ignore-unfixed: "true"
          exit-code: "1"
          skip-db-update: "true"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Watch verdict
        if: always()
        run: |
          set -uo pipefail
          bad_pin="false"
          case "${{ steps.pin.outputs.status }}" in
            drifted_no_pr|drifted_stale_pr) bad_pin="true" ;;
          esac
          if [ "${{ steps.gate.outcome }}" = "failure" ]; then
            echo "::error::Fixable CRITICAL/HIGH finding(s) in the promoted :latest image -- see the GATE step above."
          fi
          if [ "${bad_pin}" = "true" ]; then
            echo "::error::Base pin verdict: ${{ steps.pin.outputs.status }} -- see the pin step above."
          fi
          if [ "${bad_pin}" = "true" ] || [ "${{ steps.gate.outcome }}" = "failure" ]; then
            exit 1
          fi
