name: rollback-latest

# EMERGENCY ROLLBACK. Moves `:latest` back to a PREVIOUSLY BUILT digest, re-running the full smoke
# test against that digest FIRST -- so ADR-P041's invariant (":latest moves ONLY from an
# already-verified digest; a failed pipeline can never move the tag") holds on the emergency path
# exactly as it does on `promote`. This workflow NEVER builds.
#
# Why a workflow rather than a laptop one-liner: `docker buildx imagetools create` locally needs a
# PAT carrying packages:write, which nobody should be holding during an incident. Here the repo's
# own GITHUB_TOKEN does it, the smoke test re-runs first, and the reason is recorded in the run
# summary as a durable audit trail.
#
# WORTH KNOWING: the host repo pins `:latest`, not a digest (ADR-P041 Named Residual), so moving
# this tag back IS the production rollback -- no coordinated two-repo release is required.

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "sha256:... to point :latest at (from a previous green run or a sha-<gitsha> tag)"
        required: true
      reason:
        description: "Why -- recorded in the run summary as the durable audit trail"
        required: true

env:
  # Sourced from the repo variable `vars.IMAGE` -- see build-verify-promote.yml's env block for why.
  IMAGE: ${{ vars.IMAGE }}

jobs:
  reverify-and-move:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dispatch inputs reach the shell through `env:`, never interpolated into a run body --
      # a `${{ inputs.x }}` spliced directly into a script is a script-injection sink even when
      # only writers can dispatch.
      - name: Refuse anything that is not a digest
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::not a sha256 digest: ${DIGEST}"
            exit 1
          fi

      - name: Re-verify BEFORE the tag moves
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}@${DIGEST}"
          python3 scripts/smoke_test.py "${IMAGE}@${DIGEST}"

      # Same "GATE -- fixable findings" pass build-verify-promote.yml runs before `promote` moves
      # :latest -- the smoke test above only re-verifies functional correctness, not CVE status.
      # Without this, an operator could roll back to a digest that now carries a fixable
      # CRITICAL/HIGH (disclosed after that digest's original scan) with zero vulnerability
      # check, on the one path where review pressure is lowest: an active incident.
      - name: GATE -- fixable findings in the rollback target
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.IMAGE }}@${{ inputs.digest }}
          format: table
          ignore-unfixed: "true"
          exit-code: "1"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve BEFORE the move so "Record it" below can log the "from" half of the audit trail,
      # not just the target digest.
      - name: Resolve the current :latest digest (for the audit trail)
        id: previous
        run: |
          set -uo pipefail
          d="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{ .Manifest.Digest }}' 2>/dev/null || echo none)"
          echo "digest=${d}" >> "$GITHUB_OUTPUT"

      - name: Move :latest (imagetools only -- never a rebuild)
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}@${DIGEST}"

      - name: Record it
        if: always()
        env:
          DIGEST: ${{ inputs.digest }}
          PREVIOUS: ${{ steps.previous.outputs.digest }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### rollback"
            echo
            echo "- :latest was: \`${PREVIOUS}\`"
            echo "- :latest now: \`${DIGEST}\`"
            echo "- reason: ${REASON}"
            echo "- actor: ${ACTOR}"
            echo "- outcome: ${OUTCOME}"
          } >> "$GITHUB_STEP_SUMMARY"
