name: rollback-latest

# EMERGENCY ROLLBACK. Moves `:latest` back to a PREVIOUSLY BUILT digest, re-running the full
# verification (verify-image.yml: every platform the digest carries, smoke test, channel gate,
# Trivy) against that digest FIRST -- so ADR-P041's invariant (":latest moves ONLY from an
# already-verified digest; a failed pipeline can never move the tag") holds on the emergency path
# exactly as it does on `promote`. This workflow NEVER builds.
#
# Why a workflow rather than a laptop one-liner: `docker buildx imagetools create` locally needs a
# PAT carrying packages:write, which nobody should be holding during an incident. Here the repo's
# own GITHUB_TOKEN does it, the verification re-runs first, and the reason is recorded in the run
# summary as a durable audit trail.
#
# WORTH KNOWING: the host repo pins `:latest`, not a digest (ADR-P041 Named Residual), so moving
# this tag back IS the production rollback -- no coordinated two-repo release is required.

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "sha256:... to point :latest at (from a previous green run or a sha-<gitsha> tag)"
        required: true
      reason:
        description: "Why -- recorded in the run summary as the durable audit trail"
        required: true

env:
  # Sourced from the repo variable `vars.IMAGE` -- see build-verify-promote.yml's env block for why.
  IMAGE: ${{ vars.IMAGE }}

jobs:
  # The same verification `promote` waits on (issue #672): one leg per platform the TARGET digest
  # carries, each native. No `require-platforms`: a rollback target may predate #672 and carry
  # linux/amd64 only, and refusing it would block the one path built for incidents -- moving
  # `:latest` to such a digest drops arm64 for its duration, and the legs in this run name the set.
  # `:latest` is the GA tag, so the channel is always `ga`: a rollback during a live rc suppression
  # must not move :latest past a CVE the promote path refuses (issue #628). The digest's shape is
  # refused inside the called workflow, before anything is pulled.
  reverify:
    permissions:
      contents: read
      packages: read
      # Requested by the called workflow (for its SARIF upload, off here); a caller must grant it.
      security-events: write
    uses: ./.github/workflows/verify-image.yml
    with:
      digest: ${{ inputs.digest }}
      channel: ga

  move:
    # No `always()`: a red or skipped `reverify` leg skips this job, so `:latest` never moves past
    # an unverified member.
    needs: reverify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      previous: ${{ steps.previous.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve BEFORE the move so `record` can log the "from" half of the audit trail, not just
      # the target digest.
      - name: Resolve the current :latest digest (for the audit trail)
        id: previous
        run: |
          set -uo pipefail
          d="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{ .Manifest.Digest }}' 2>/dev/null || echo none)"
          echo "digest=${d}" >> "$GITHUB_OUTPUT"

      # Dispatch inputs reach the shell through `env:`, never interpolated into a run body --
      # a `${{ inputs.x }}` spliced directly into a script is a script-injection sink even when
      # only writers can dispatch.
      - name: Move :latest (imagetools only -- never a rebuild)
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}@${DIGEST}"

  # The durable audit trail, written whatever happened -- including a refused re-verification,
  # which is exactly the incident record someone will look for. Its own job, so its `always()`
  # can never reach the move.
  record:
    needs: [reverify, move]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record it
        env:
          DIGEST: ${{ inputs.digest }}
          PREVIOUS: ${{ needs.move.outputs.previous || 'not resolved (move did not run)' }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
          REVERIFY: ${{ needs.reverify.result }}
          MOVE: ${{ needs.move.result }}
        run: |
          {
            echo "### rollback"
            echo
            echo "- :latest was: \`${PREVIOUS}\`"
            echo "- target: \`${DIGEST}\`"
            echo "- re-verification: ${REVERIFY} (one leg per platform the target carries)"
            echo "- move: ${MOVE}"
            echo "- reason: ${REASON}"
            echo "- actor: ${ACTOR}"
          } >> "$GITHUB_STEP_SUMMARY"
